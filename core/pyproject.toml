[project]
name = "countersign"
version = "0.1.0"
description = "AI payables clerk for small general contractors (Python side)"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.28",
  "pydantic>=2.10",
  "python-dotenv>=1.0",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "python-multipart>=0.0.20",
  "reportlab>=4.2",
  "pypdf>=5.0",
  "anthropic>=2.0",
  "droid-sdk[mcp]>=0.5.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["countersign"]

[tool.pytest.ini_options]
testpaths = ["tests"]
